<title>CR工程板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f1f2ef; --surface:#fbfbfa; --sunk:#e8eae5;
  --ink:#191b1e; --ink2:#5c6166; --ink3:#8b9096;
  --rule:#d7d9d4; --rule2:#c3c6c0;
  --shu:#b5392e; --shu-soft:#f3e2e0; --shu-line:#e0bdb8;
  --ochre:#8c6d1f; --ochre-soft:#f2ecda; --ochre-line:#ddd0a8;
  --matcha:#2f6b52; --matcha-soft:#e0ece6; --matcha-line:#b6d2c5;
  --disp:"Zen Kaku Gothic New",-apple-system,"Hiragino Sans",sans-serif;
  --body:"Noto Sans JP",-apple-system,"Hiragino Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#15171a; --surface:#1d2024; --sunk:#101215;
    --ink:#e7e5e0; --ink2:#a2a7ad; --ink3:#71767d;
    --rule:#2e3238; --rule2:#3d424a;
    --shu:#e0675a; --shu-soft:#33211f; --shu-line:#5a322d;
    --ochre:#cda546; --ochre-soft:#2b2618; --ochre-line:#54472447;
    --matcha:#61b393; --matcha-soft:#17281f; --matcha-line:#2d4a3b;
  }
}
:root[data-theme="dark"]{
  --ground:#15171a; --surface:#1d2024; --sunk:#101215;
  --ink:#e7e5e0; --ink2:#a2a7ad; --ink3:#71767d;
  --rule:#2e3238; --rule2:#3d424a;
  --shu:#e0675a; --shu-soft:#33211f; --shu-line:#5a322d;
  --ochre:#cda546; --ochre-soft:#2b2618; --ochre-line:#544724;
  --matcha:#61b393; --matcha-soft:#17281f; --matcha-line:#2d4a3b;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);
  font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}
/* 案件ナビ */
nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--rule);
  margin:0 -20px 22px;padding:0 20px;position:sticky;top:0;background:var(--ground);z-index:10}
nav a{flex:0 0 auto;padding:12px 13px 10px;font-size:12px;color:var(--ink2);
  text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;
  display:flex;align-items:baseline;gap:6px}
nav a:hover{color:var(--ink)}
nav a[aria-current]{color:var(--ink);border-bottom-color:var(--shu);font-weight:700}
nav a b{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink3)}
nav a[aria-current] b{color:var(--shu)}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

/* 見出し */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;
  padding-bottom:14px;border-bottom:2px solid var(--ink)}
h1{font-family:var(--disp);font-weight:900;font-size:27px;letter-spacing:.06em;
  margin:0;line-height:1.1}
.sub{color:var(--ink2);font-size:12.5px;margin:3px 0 0}
.hstat{margin-left:auto;display:flex;gap:20px;text-align:right}
.hstat div span{display:block}
.hstat .n{font-family:var(--mono);font-weight:600;font-size:22px;
  font-variant-numeric:tabular-nums;line-height:1.15}
.hstat .l{font-size:10.5px;letter-spacing:.13em;color:var(--ink3)}
.hstat .mine .n{color:var(--shu)}

h2{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.14em;
  margin:36px 0 3px;display:flex;align-items:baseline;gap:10px}
h2 em{font-style:normal;font-family:var(--body);font-weight:400;font-size:11.5px;
  letter-spacing:0;color:var(--ink3)}

/* 工程レール */
#tally{margin:8px 0 0;font-size:11.5px;font-family:var(--mono);
  padding:6px 10px;border-left:3px solid var(--matcha);background:var(--matcha-soft);
  color:var(--ink2)}
#tally.ng{border-left-color:var(--shu);background:var(--shu-soft);color:var(--shu)}
.rail{display:flex;gap:0;overflow-x:auto;padding:14px 0 4px;margin-top:12px}
.stage{flex:0 0 auto;min-width:96px;padding:10px 12px 11px;background:var(--surface);
  border:1px solid var(--rule);border-right:none;position:relative;cursor:pointer;
  text-align:left;font:inherit;color:inherit;transition:background .12s}
.stage:last-child{border-right:1px solid var(--rule)}
.stage:hover,.stage:focus-visible{background:var(--sunk);outline:none}
.stage:focus-visible{box-shadow:inset 0 0 0 2px var(--ink)}
.stage[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.stage[aria-pressed="true"] .sn,.stage[aria-pressed="true"] .sc,
.stage[aria-pressed="true"] .st{color:var(--ground)}
.stage::before{content:"";position:absolute;inset:0 0 auto 0;height:3px}
.stage.mine::before{background:var(--shu)}
.stage.wait::before{background:var(--ochre)}
.stage.done::before{background:var(--matcha)}
.sn{font-size:11.5px;font-weight:500;display:block;white-space:nowrap}
.sc{font-family:var(--mono);font-weight:600;font-size:23px;line-height:1.2;
  font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.stage.mine .sc{color:var(--shu)} .stage.wait .sc{color:var(--ochre)}
.stage.done .sc{color:var(--matcha)}
.sc.zero{color:var(--ink3)!important;font-weight:400}
.st{font-size:10px;color:var(--ink3);display:block;white-space:nowrap}

/* Todo */
.stalls{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);
  margin-top:12px}
.todohead{background:var(--ink);color:var(--ground);padding:8px 14px;
  font-family:var(--disp);font-weight:700;font-size:13px;display:flex;gap:10px;
  align-items:baseline}
.todohead em{font-style:normal;font-family:var(--mono);font-size:10.5px;
  padding:1px 6px;background:var(--shu);color:#fff;flex:0 0 auto;letter-spacing:.04em}
.todohead.wait em{background:var(--ochre)}
.todohead span{font-family:var(--body);font-weight:400;font-size:11px;opacity:.72;
  margin-left:auto;white-space:nowrap}
.stall{background:var(--surface);padding:9px 14px;display:flex;flex-wrap:wrap;
  gap:5px 12px;align-items:baseline;border-left:3px solid transparent}
.stall.mine{border-left-color:var(--shu)}
.stall.wait{border-left-color:var(--ochre)}
.stall .pj{font-size:11.5px;color:var(--ink2);min-width:100px}
.stall .cnt{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:96px}
.stall .ids{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 240px}

/* 番号チップ */
.chip{font-family:var(--mono);font-size:11px;font-weight:500;padding:1px 6px;
  border:1px solid var(--rule2);background:var(--ground);color:var(--ink2);
  cursor:pointer;letter-spacing:.02em}
.chip:hover,.chip:focus-visible{border-color:var(--ink);color:var(--ink);outline:none}

/* 絞り込み */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.f{font-family:var(--body);font-size:11.5px;padding:4px 10px;border:1px solid var(--rule2);
  background:var(--surface);color:var(--ink2);cursor:pointer;letter-spacing:.03em}
.f[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.f:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#q{flex:1 1 220px;min-width:160px;font-family:var(--mono);font-size:12px;padding:4px 9px;
  border:1px solid var(--rule2);background:var(--surface);color:var(--ink)}
#q:focus{outline:none;border-color:var(--ink)}


/* 登録簿 */
/* **登録簿だけ横いっぱい**（本人 2026-09-14）。上の段は1180pxのまま、
   ここだけ画面幅に抜く。左端は上と揃うので、右に伸びる形になる */
.bleed{width:100vw;margin-left:calc(50% - 50vw);padding:0 max(20px, calc(50vw - 590px))}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px;
  table-layout:fixed}
col.cId{width:78px} col.cStg{width:104px} col.cWho{width:150px} col.cD{width:60px}
thead th{text-align:left;font-family:var(--disp);font-weight:700;font-size:10.5px;
  letter-spacing:.12em;color:var(--ink3);padding:0 10px 6px;border-bottom:1px solid var(--rule2);
  white-space:nowrap}
tbody tr{border-bottom:1px solid var(--rule);cursor:pointer}
tbody tr:hover{background:var(--surface)}
tbody td{padding:7px 10px;vertical-align:top}
td.id{font-family:var(--mono);font-weight:600;font-size:12px;white-space:nowrap;
  border-left:3px solid transparent;padding-left:9px}
tr.mine td.id{border-left-color:var(--shu)}
tr.wait td.id{border-left-color:var(--ochre)}
tr.done td.id{border-left-color:var(--matcha)}
td.stg{white-space:nowrap;font-size:11.5px}
td.d{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink3);
  text-align:right;white-space:nowrap;font-size:11.5px}
td.txt{color:var(--ink2);max-width:1px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;padding:0 6px;border:1px solid;
  letter-spacing:.02em}
.pill.mine{color:var(--shu);border-color:var(--shu-line);background:var(--shu-soft)}
.pill.wait{color:var(--ochre);border-color:var(--ochre-line);background:var(--ochre-soft)}
.pill.done{color:var(--matcha);border-color:var(--matcha-line);background:var(--matcha-soft)}
.none{padding:24px 10px;color:var(--ink3);font-size:12.5px}

/* 中身 */
.sheet{position:fixed;inset:0 0 0 auto;width:min(560px,100%);background:var(--surface);
  border-left:1px solid var(--rule2);overflow-y:auto;padding:22px 24px 60px;
  transform:translateX(100%);transition:transform .2s ease;z-index:20;
  box-shadow:-14px 0 40px rgba(0,0,0,.13)}
.sheet.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:19}
.scrim.open{opacity:1;pointer-events:auto}
.sheet h3{font-family:var(--mono);font-weight:600;font-size:21px;margin:0;letter-spacing:.02em}
.sheet .pj2{font-size:11.5px;color:var(--ink3);margin:1px 0 14px}
.close{position:absolute;top:16px;right:18px;background:none;border:1px solid var(--rule2);
  color:var(--ink2);font-size:15px;line-height:1;padding:4px 8px;cursor:pointer;font-family:var(--mono)}
.close:hover{border-color:var(--ink);color:var(--ink)}
.turn{padding:9px 12px;border-left:3px solid;margin-bottom:16px;font-size:12.5px}
.turn.mine{border-color:var(--shu);background:var(--shu-soft)}
.turn.wait{border-color:var(--ochre);background:var(--ochre-soft)}
.turn.done{border-color:var(--matcha);background:var(--matcha-soft)}
.turn b{font-family:var(--disp);font-size:13.5px}
.turn span{color:var(--ink2)}
dl{margin:0;display:grid;grid-template-columns:78px 1fr;gap:1px 0;
  background:var(--rule);border:1px solid var(--rule)}
dt{background:var(--sunk);padding:7px 9px;font-size:10.5px;letter-spacing:.08em;
  color:var(--ink3);font-family:var(--disp);font-weight:700}
dd{background:var(--surface);margin:0;padding:7px 11px;font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;line-height:1.75}
dd.mono{font-family:var(--mono);font-size:11.5px}
dd a{color:var(--shu)}
@media (max-width:700px){
  .bleed{width:auto;margin-left:0;padding:0}
  .wrap{padding:20px 14px 80px}
  h1{font-size:22px} .hstat{margin-left:0;width:100%;justify-content:flex-start}
  .stall .who,.stall .pj{min-width:0}
  th.hx,td.hx{display:none}
  dl{grid-template-columns:66px 1fr}
  .sheet{width:100%;border-left:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <dl id="sDl"></dl>

  b.className = 'f'; b.setAttribute('aria-pressed', 'false');
  b.textContent = `${略}　${名}　${n}`;
  b.onclick = () => { fPj = fPj === 名 ? null : 名; draw(); };
  b.dataset.pj = 名;
  pjs.appendChild(b);
});

/* 足したらシートの行数になるか（決めごと637） */
(() => {
  const el = document.getElementById('tally');
  const 対象 = D.絞り ? [D.絞り] : Object.keys(D.略号);
  const ずれ = 対象.map(p => {
    const 工 = D.CR.filter(c => c.商材 === p).length;
    const 行 = (D.行数 || {})[p];
    return { p, 工, 行 };
  }).filter(x => x.行 != null && x.工 !== x.行);
  const 計 = D.CR.length;
  const 行計 = 対象.reduce((s, p) => s + ((D.行数 || {})[p] || 0), 0);
  if (ずれ.length) {
    el.className = 'ng';
    el.textContent = '工程の合計がシートの行数と合わない　'
      + ずれ.map(x => `${x.p} ${x.工}/${x.行}`).join('、');
  } else {
    el.textContent = `✓ 工程を全部足すと ${計} ＝ 依頼シートの行数 ${行計}`
      + (D.絞り ? '' : `（${対象.length}案件とも一致）`);
  }
})();


/* Todo＝全工程のやること（決めごと640） */
(() => {
  // **要素は getElementById で取る。**id頼みの暗黙グローバルに寄りかかると、
  // 置換で定義行が消えても気づけない（2026-09-14・決めごと643）
  const box = document.getElementById('stalls');
  let 総 = 0;
  const html = D.工程.filter(x => x.やること).map(x => {
    const v = D.CR.filter(c => c.工程 === x.名);
    if (!v.length) return '';
    総 += v.length;
    const k = x.種 === '進' ? 'mine' : 'wait';
    const byPj = {};
    v.forEach(c => (byPj[c.商材] = byPj[c.商材] || []).push(c));
    const 行 = Object.entries(byPj).sort((a, b) => b[1].length - a[1].length)
      .map(([pj, cs]) => {
        cs.sort((a, b) => (+b.番号) - (+a.番号));
        const 最 = Math.max(...cs.map(c => c.日数));
        const ids = cs.slice(0, 12)
          .map(c => `<button class="chip" data-id="${c.id}">${c.id}</button>`).join('')
          + (cs.length > 12 ? `<span class="cnt">ほか${cs.length - 12}</span>` : '');
        return `<div class="stall ${k}"><span class="pj">${pj}</span>`
          + `<span class="cnt">${cs.length}本${最 >= 3 ? '・最長' + 最 + '日' : ''}</span>`
          + `<span class="ids">${ids}</span></div>`;
      }).join('');
    return `<div class="todohead ${k}"><em>${x.種}</em><b>${x.やること}</b>`
      + `<span>${v.length}本・${x.名}</span></div>` + 行;
  }).join('');
  box.innerHTML = html || '<div class="stall">やることは無い。</div>';
  const note = document.getElementById('todoNote');
  if (総 && note) note.insertAdjacentHTML('beforeend',
    ` <b style="font-family:var(--mono);color:var(--shu)">合計${総}本</b>`);
})();

/* 登録簿 */
const rows = document.getElementById('rows');
function draw() {
  document.querySelectorAll('.stage').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.stage === fStage));
  document.querySelectorAll('.f[data-pj]').forEach(b =>
    b.setAttribute('aria-pressed', b.dataset.pj === fPj));
  const q = fQ.trim().toLowerCase();
  const list = D.CR.filter(c =>
    (!fStage || c.工程 === fStage) && (!fPj || c.商材 === fPj) &&
    (!q || c.id.toLowerCase().includes(q) || (c.訴求 + c.絵 + c.検収).toLowerCase().includes(q))
  ).sort((a, b) =>
    案順.indexOf(a.商材) - 案順.indexOf(b.商材) || (+b.番号) - (+a.番号));
  rows.innerHTML = list.map(c => {
    const k = kind(c.工程);
    return `<tr class="${k}" data-id="${c.id}">`
      + `<td class="id">${c.id}</td>`
      + `<td class="stg"><span class="pill ${k}">${c.工程}</span></td>`
      + `<td class="hx">${D.絞り ? c.やること : c.商材}</td>`
      + `<td class="txt hx">${(c.訴求 || c.絵 || '').replace(/\n/g, ' ').slice(0, 200)}</td>`
      + `<td class="d">${c.日数}日</td></tr>`;
  }).join('');
  document.getElementById('none').hidden = list.length > 0;
}

/* 中身 */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function open_(id) {
  const c = D.CR.find(x => x.id === id); if (!c) return;
  const k = kind(c.工程);
  sId.textContent = c.id;
  sPj.textContent = `${c.商材}　${c.番号}番　${c.比率 || ''}`;
  sTurn.className = 'turn ' + k;
  sTurn.innerHTML = `<b>${c.工程}</b> <span>→ ${c.やること}・${c.日数}日</span>`;
  const F = [['依頼日', c.依頼日], ['入れる訴求', c.訴求], ['絵の指示', c.絵],
    ['入れる注釈', c.注釈], ['横転元', c.横転元], ['元の実物', c.元の実物],
    ['検収', c.検収], ['審査', c.審査], ['おちた理由', c.落ち理由], ['配信', c.配信],
    ['作り直し先', c.作り直し先], ['作り直し元', c.作り直し元],
    ['クライアント', c.クライアント], ['入稿日', c.入稿日]];
  sDl.innerHTML = F.filter(([, v]) => v).map(([n, v]) => {
    const mono = ['横転元', '元の実物', '依頼日', '入稿日',
                  '作り直し先', '作り直し元'].includes(n);
    if (n === '作り直し先' || n === '作り直し元')
      return `<dt>${n}</dt><dd class="mono">`
        + `<button class="chip" data-id="${esc(v)}">${esc(v)}</button></dd>`;
    return `<dt>${n}</dt><dd class="${mono ? 'mono' : ''}">${esc(v)}</dd>`;
  }).join('') + (c.完成 ? `<dt>完成CR</dt><dd class="mono"><a href="${c.完成}" target="_blank" rel="noopener">Driveで開く</a></dd>` : '');
  sheet.classList.add('open'); scrim.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false'); document.getElementById('close').focus();
}
const esc = s => String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
function shut() {
  sheet.classList.remove('open'); scrim.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
}
document.getElementById('close').onclick = shut;
scrim.onclick = shut;
addEventListener('keydown', e => { if (e.key === 'Escape') shut(); });
document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-id]'); if (t) open_(t.dataset.id);
});
document.getElementById('q').addEventListener('input', e => { fQ = e.target.value; draw(); });
document.getElementById('clear').onclick = () => {
  fStage = fPj = null; fQ = ''; document.getElementById('q').value = ''; draw();
};
if (!D.絞り) document.getElementById('th3').textContent = '案件';
draw();
</script>
